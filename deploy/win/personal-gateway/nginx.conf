# personal-gateway nginx — ROUTING ONLY. Auth is enforced inside each backend
# (mcp_auth); this proxy does not authenticate, it only maps path prefixes to
# the right service and forwards the Authorization header untouched.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # gemini-search MCP (streamable-HTTP at /mcp). Long-lived SSE streams.
    location /gemini-search/ {
        proxy_pass http://gemini-search:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Upgrade $http_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # mimo-tts (OpenAI-compatible /v1/audio/*).
    location /mimo/ {
        proxy_pass http://mimo-tts-proxy:9880/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 50m;
    }

    location = /health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
